<script>
(function (root) {
  'use strict';

  const VERSION = 1;
  const catalog = [
    { type: 'engine', name: 'Motor de impulso', description: 'Aumenta o tanque e reduz o combustível gasto entre planetas.', stat: 'Eficiência de voo' },
    { type: 'warp', name: 'Núcleo de dobra', description: 'Reduz o combustível de dobra necessário para alcançar outra galáxia.', stat: 'Eficiência de dobra' },
    { type: 'life', name: 'Suporte de vida', description: 'Amplia a reserva de oxigênio e reduz o consumo nas expedições.', stat: 'Reserva de oxigênio' },
    { type: 'shield', name: 'Escudo de radiação', description: 'Reforça o casco e protege a nave em ambientes hostis.', stat: 'Proteção ambiental' },
    { type: 'scanner', name: 'Scanner orbital', description: 'Identifica planetas, rende mais dados e melhora a chance de módulos raros.', stat: 'Qualidade da análise' },
    { type: 'arm', name: 'Braço coletor', description: 'Recupera mais minério, cristais e créditos em cada expedição.', stat: 'Coleta de recursos' },
    { type: 'cargo', name: 'Armazém modular', description: 'Abre espaço para guardar e comparar mais módulos recuperados.', stat: 'Espaços de inventário' },
    { type: 'survival', name: 'Kit de sobrevivência', description: 'Reduz o consumo de oxigênio e o dano causado pelo ambiente.', stat: 'Autonomia da expedição' }
  ];
  const TYPES = catalog.map(item => item.type);
  const rarities = {
    common: { key: 'common', name: 'Comum', color: '#a8b8c8', multiplier: 1 },
    uncommon: { key: 'uncommon', name: 'Incomum', color: '#7ddeaa', multiplier: 1.28 },
    rare: { key: 'rare', name: 'Raro', color: '#63b9ff', multiplier: 1.72 },
    epic: { key: 'epic', name: 'Épico', color: '#c49aff', multiplier: 2.3 },
    legendary: { key: 'legendary', name: 'Lendário', color: '#ffc76a', multiplier: 3.15 }
  };
  const missions = [
    { id: 'scan', title: 'Um primeiro olhar', description: 'Analise Auralis IV com o scanner orbital.', action: 'Escanear planeta' },
    { id: 'dock', title: 'Pouso em Auralis', description: 'Ancore em um planeta analisado para iniciar uma expedição.', action: 'Ancorar' },
    { id: 'explore', title: 'Além da escotilha', description: 'Explore um ponto de interesse e recupere recursos e módulos.', action: 'Explorar um local' },
    { id: 'equip', title: 'Uma nave só sua', description: 'Equipe um módulo recuperado na aba Nave.', action: 'Equipar módulo' },
    { id: 'warp', title: 'O próximo horizonte', description: 'Refine cristais, decole e use a dobra para alcançar outra galáxia.', action: 'Saltar de galáxia' }
  ];
  const BIOMES = {
    forest: { name: 'Floresta bioluminescente', color: '#7edaa6', temp: [9, 31], rad: [3, 22], atmosphere: 'Respirável', sites: ['Bosque luminoso', 'Santuário esquecido', 'Gruta das sementes'], anomalies: ['Flora que responde à luz das estrelas', 'Árvores ligadas por uma rede mineral', 'Esporos com memória luminosa'] },
    volcanic: { name: 'Mundo vulcânico', color: '#f59367', temp: [95, 190], rad: [48, 86], atmosphere: 'Tóxica · gases sulfúricos', sites: ['Caldeira de obsidiana', 'Forja abandonada', 'Túnel de lava'], anomalies: ['Relâmpagos dentro de rios de lava', 'Cristais que armazenam calor', 'Uma forja emite sinais antigos'] },
    ice: { name: 'Geleiras eternas', color: '#92cce8', temp: [-115, -35], rad: [12, 42], atmosphere: 'Rarefeita · gelo de nitrogênio', sites: ['Fenda azul', 'Observatório congelado', 'Lago sob o gelo'], anomalies: ['Um oceano pulsa sob a crosta', 'Sinais de rádio presos no gelo', 'Auroras que acompanham a nave'] },
    desert: { name: 'Dunas de cobre', color: '#e9be77', temp: [38, 78], rad: [26, 64], atmosphere: 'Rarefeita · poeira metálica', sites: ['Mar de dunas', 'Farol soterrado', 'Cânion de cobre'], anomalies: ['Dunas movem-se contra o vento', 'Estruturas sob a areia emitem calor', 'Areia magnética desenha constelações'] },
    ocean: { name: 'Oceano de safira', color: '#619ddc', temp: [2, 26], rad: [8, 36], atmosphere: 'Respirável · umidade elevada', sites: ['Atol flutuante', 'Estação submersa', 'Recife abissal'], anomalies: ['Ilhas flutuam em campos magnéticos', 'O oceano canta em baixa frequência', 'Recifes formam circuitos naturais'] },
    crystal: { name: 'Deserto de cristais', color: '#b7a2e3', temp: [-20, 48], rad: [42, 92], atmosphere: 'Ionizada · partículas exóticas', sites: ['Jardim de prismas', 'Portal partido', 'Catedral de quartzo'], anomalies: ['Cristais dobram a luz ao redor da nave', 'Um eco responde antes da transmissão', 'A gravidade oscila a cada aurora'] }
  };
  const MODULE_NAMES = {
    engine: ['Propulsor Cometa', 'Motor Vento Solar', 'Turbina de Íons'],
    warp: ['Núcleo Horizonte', 'Dobra Aurora', 'Matriz de Alcubierre'],
    life: ['Jardim de Oxigênio', 'Filtro Biosfera', 'Pulmão Estelar'],
    shield: ['Escudo Magnetar', 'Malha de Faraday', 'Campo Guardião'],
    scanner: ['Scanner Prisma', 'Olho de Órion', 'Espectrômetro Íris'],
    arm: ['Braço Libélula', 'Coletor Aracne', 'Pinça Orbital'],
    cargo: ['Armazém Colmeia', 'Baú de Órion', 'Compartimento Atlas'],
    survival: ['Kit Pioneiro', 'Abrigo Nômade', 'Mochila Fronteira']
  };

  function hashSeed(value) {
    if (typeof value === 'number' && Number.isFinite(value)) return value >>> 0;
    let result = 2166136261;
    for (const char of String(value)) result = Math.imul(result ^ char.charCodeAt(0), 16777619);
    return result >>> 0;
  }
  function generator(seed) {
    let value = seed >>> 0;
    return function () {
      value = (value + 0x6D2B79F5) >>> 0;
      let t = value;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function random(state) {
    state.rng = (state.rng + 0x6D2B79F5) >>> 0;
    let t = state.rng;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  const integer = (rng, low, high) => low + Math.floor(rng() * (high - low + 1));
  const pick = (rng, values) => values[Math.floor(rng() * values.length)];
  const rounded = value => Math.round(value * 100) / 100;
  const clone = value => JSON.parse(JSON.stringify(value));

  function generateGalaxy(seed, index) {
    const galaxySeed = hashSeed(seed + ':galaxy:' + index);
    const rng = generator(galaxySeed);
    const biomes = Object.keys(BIOMES);
    for (let i = biomes.length - 1; i > 1; i--) {
      const j = integer(rng, 1, i);
      [biomes[i], biomes[j]] = [biomes[j], biomes[i]];
    }
    const first = ['Auralis', 'Nivara', 'Kepler', 'Veloria', 'Talos', 'Nyx', 'Elyria', 'Oriana', 'Lumera', 'Vesper'];
    const romans = ['II', 'III', 'IV', 'V', 'VI', 'VII', 'IX'];
    const remainingNames = first.slice();
    const planets = biomes.map((biome, i) => {
      const definition = BIOMES[biome];
      const planetSeed = hashSeed(galaxySeed + ':planet:' + i);
      const prng = generator(planetSeed);
      const id = 'g' + index + '-p' + i;
      const special = index === 0 && i === 0;
      const nameIndex = special ? remainingNames.indexOf('Auralis') : integer(prng, 0, remainingNames.length - 1);
      const stem = remainingNames.splice(nameIndex, 1)[0];
      return {
        id, seed: planetSeed,
        name: special ? 'Auralis IV' : stem + ' ' + pick(prng, romans),
        biome, biomeName: definition.name, color: definition.color,
        temperature: special ? 22 : integer(prng, ...definition.temp),
        atmosphere: definition.atmosphere, breathable: biome === 'forest' || biome === 'ocean',
        radiation: special ? 8 : integer(prng, ...definition.rad),
        gravity: special ? 0.94 : rounded(0.42 + prng() * 1.32),
        anomaly: pick(prng, definition.anomalies),
        distance: 18 + i * 23 + integer(prng, 0, 12),
        size: rounded(0.68 + prng() * 0.55),
        angle: rounded(prng() * Math.PI * 2),
        scanned: false,
        sites: definition.sites.map((name, n) => ({ id: id + '-s' + n, name, explored: false }))
      };
    });
    return {
      id: 'galaxy-' + index, seed: galaxySeed,
      name: index === 0 ? 'Véu de Íris' : pick(rng, ['Mar de Órion', 'Coroa de Lyra', 'Jardim de Nyx', 'Espelho de Vega', 'Arco de Cassiopeia', 'Nuvem de Safira']) + ' ' + (index + 1),
      planets
    };
  }

  function makeModule(state, type, rarity, level, origin) {
    const descriptor = catalog.find(item => item.type === type);
    const power = rounded(rarities[rarity].multiplier * (1 + (level - 1) * 0.16));
    return {
      id: 'm' + state.nextModuleId++, type,
      name: MODULE_NAMES[type][Math.floor(random(state) * MODULE_NAMES[type].length)],
      rarity, level, power, origin: origin || 'recovered',
      description: descriptor.stat + ' · ' + power.toFixed(2).replace('.', ',') + '×'
    };
  }

  function create(seed) {
    const numericSeed = hashSeed(seed === undefined ? Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF) : seed);
    const state = {
      version: VERSION, seed: numericSeed, rng: numericSeed, nextModuleId: 1,
      turn: 0, galaxyIndex: 0, visitedGalaxies: 1,
      galaxy: generateGalaxy(numericSeed, 0),
      location: { planetId: 'g0-p0', mode: 'orbit' },
      ship: { name: 'Andorinha', color: '#f0a270' },
      resources: { fuel: 90, oxygen: 100, hull: 100, warpFuel: 1, crystals: 3, ore: 12, credits: 120, data: 0 },
      equipped: {}, inventory: [],
      progress: { scans: 0, landings: 0, explorations: 0, modulesEquipped: 0, warps: 0 },
      mission: { stage: 0, completed: [] },
      log: [{ id: 0, text: 'Bem-vindo ao Véu de Íris. Auralis IV aguarda sua primeira análise.', kind: 'info' }]
    };
    TYPES.forEach(type => { state.equipped[type] = makeModule(state, type, 'common', 1, 'starter'); });
    state.inventory.push(makeModule(state, 'scanner', 'rare', 1, 'cache'));
    state.inventory.push(makeModule(state, 'cargo', 'uncommon', 1, 'cache'));
    return state;
  }

  function stats(state) {
    const power = type => state.equipped[type].power;
    return {
      maxFuel: Math.round(100 + 15 * (power('engine') - 1)),
      maxOxygen: Math.round(100 + 25 * (power('life') - 1) + 8 * (power('survival') - 1)),
      maxHull: Math.round(100 + 20 * (power('shield') - 1)),
      maxWarpFuel: 12,
      cargoCapacity: Math.min(24, 8 + Math.round(power('cargo') * 2)),
      cargoUsed: state.inventory.length,
      fuelEfficiency: rounded(1 + 0.22 * (power('engine') - 1)),
      scanBonus: rounded(0.25 * (power('scanner') - 1)),
      radiationProtection: rounded(Math.min(0.82, 0.20 + 0.13 * (power('shield') - 1) + 0.04 * (power('survival') - 1))),
      oxygenEfficiency: rounded(1 + 0.18 * (power('life') - 1) + 0.12 * (power('survival') - 1)),
      collectionBonus: rounded(1 + 0.20 * (power('arm') - 1)),
      warpEfficiency: rounded(1 + 0.35 * (power('warp') - 1))
    };
  }
  function currentPlanet(state) { return state.galaxy.planets.find(planet => planet.id === state.location.planetId); }
  function travelCost(state, planetId) {
    const target = state.galaxy.planets.find(planet => planet.id === planetId);
    const current = currentPlanet(state);
    if (!target || !current) return null;
    if (current.id === target.id) return 0;
    return Math.ceil((12 + Math.abs(target.distance - current.distance) * 0.14) / stats(state).fuelEfficiency);
  }
  function warpCost(state) { return Math.max(1, Math.round(3 / stats(state).warpEfficiency)); }
  function explorationCost(state) {
    const planet = currentPlanet(state);
    const computed = stats(state);
    const harshness = Math.max(0, Math.abs(planet.temperature - 20) - 20);
    return {
      oxygen: Math.max(3, Math.ceil((8 + planet.radiation * 0.07 + harshness * 0.025) / computed.oxygenEfficiency)),
      hull: Math.max(0, Math.round((planet.radiation * 0.16 + harshness * 0.025 + (planet.breathable ? 0 : 2)) * (1 - computed.radiationProtection) - state.equipped.survival.power * 2))
    };
  }

  function reject(message, cost) { return { ok: false, message, cost: cost || {} }; }
  function plan(state, action, payload) {
    const data = payload || {};
    const planet = currentPlanet(state);
    const computed = stats(state);
    const res = state.resources;
    let cost = {};
    let info = {};
    if (!planet) return reject('Posição desconhecida. Carregue uma exploração válida.');
    switch (action) {
      case 'travel': {
        const targetId = typeof data === 'string' ? data : data.planetId;
        const target = state.galaxy.planets.find(item => item.id === targetId);
        if (!target) return reject('Selecione um planeta desta galáxia.');
        if (state.location.mode !== 'orbit') return reject('Decole antes de viajar.');
        if (target.id === planet.id) return reject('Sua nave já está neste planeta.');
        cost = { fuel: travelCost(state, target.id), oxygen: 3 };
        info.target = target;
        break;
      }
      case 'scan':
        if (planet.scanned) return reject('A análise deste planeta já está completa.');
        cost = { oxygen: 2 };
        break;
      case 'dock':
        if (state.location.mode === 'docked') return reject('Sua nave já está ancorada.');
        if (!planet.scanned) return reject('Analise o planeta para localizar um ponto de pouso seguro.');
        break;
      case 'explore': {
        if (state.location.mode !== 'docked') return reject('Ancore no planeta antes de iniciar uma expedição.');
        if (!planet.scanned) return reject('Analise o planeta antes de explorar.');
        const siteId = typeof data === 'string' ? data : data.siteId;
        const site = siteId ? planet.sites.find(item => item.id === siteId) : planet.sites.find(item => !item.explored);
        if (!site) return reject('Todos os locais deste planeta já foram explorados.');
        if (site.explored) return reject('Este local já foi explorado.');
        cost = explorationCost(state);
        info.site = site;
        break;
      }
      case 'launch':
        if (state.location.mode !== 'docked') return reject('Sua nave já está em órbita.');
        break;
      case 'warp':
        if (state.location.mode !== 'orbit') return reject('Decole antes de iniciar a dobra.');
        cost = { warpFuel: warpCost(state), oxygen: 5 };
        break;
      case 'equip': {
        const moduleId = typeof data === 'string' ? data : data.moduleId;
        const module = state.inventory.find(item => item.id === moduleId);
        if (!module) return reject('Este módulo não está no inventário.');
        if (module.type === 'cargo') {
          const capacity = Math.min(24, 8 + Math.round(module.power * 2));
          if (state.inventory.length > capacity) return reject('Recicle módulos até ter no máximo ' + capacity + ' no inventário.');
        }
        info.module = module;
        break;
      }
      case 'salvage': {
        const moduleId = typeof data === 'string' ? data : data.moduleId;
        const module = state.inventory.find(item => item.id === moduleId);
        if (!module) return reject('Escolha um módulo do inventário para reciclar.');
        info.module = module;
        break;
      }

      lower.innerHTML=`<div class="og-section-heading"><h2>Sistemas equipados</h2><span>8 ENCAIXES MODULARES</span></div><div class="og-equipment">${Object.values(state.equipped).map(m=>`<div class="og-equipped" style="--rarity:${rarity(m).color}" data-tooltip="${esc(m.description)}"><span class="og-equipped-code">${codes[m.type]}</span><div class="og-equipped-text"><strong>${esc(m.name)}</strong><small>${esc(rarity(m).name)} · ${power(m.power)}× potência</small></div></div>`).join('')}</div><div class="og-section-heading"><h2>Módulos no armazém</h2><span>${state.inventory.length} PEÇAS · TROQUE E EXPERIMENTE</span></div><div class="og-inventory">${state.inventory.length ? state.inventory.map(moduleCard).join('') : '<div class="og-inventory-empty">Explore pontos de interesse nos planetas para recuperar novas peças.</div>'}</div>`;
    } else if(tab==='log') {
      lower.innerHTML=`<div class="og-section-heading"><h2>Últimas transmissões</h2><span>REGISTRO DA EXPEDIÇÃO</span></div><div class="og-logbook">${state.log.map((l,i)=>`<div class="og-log-entry"><time>${String(l.id).padStart(3,'0')}</time><span>${esc(l.text)}</span></div>`).join('')}</div>`;
    } else {
      lower.innerHTML=`<div class="og-section-heading"><h2>${tab==='galaxy' ? 'Mundos desta galáxia' : 'Seu próximo horizonte'}</h2><span>ESCOLHA UM DESTINO</span></div><div class="og-destinations">${state.galaxy.planets.map(p=>`<button class="og-planet-card ${p.id===selected ? 'is-selected' : ''}" data-select="${esc(p.id)}" aria-pressed="${p.id===selected}" aria-label="Selecionar ${esc(p.name)}, ${biomeNames[p.biome]}, ${p.id===state.location.planetId ? 'local atual' : E.travelCost(state,p.id)+' combustível'}"><span class="og-planet-orb" style="--planet-color:${p.color}" aria-hidden="true"></span>${p.id===state.location.planetId ? '<span class="og-orbit-marker">VOCÊ</span>' : ''}<strong>${esc(p.name)}</strong><small>${esc(biomeNames[p.biome] || p.biome)}</small><small>${p.id===state.location.planetId ? (state.location.mode==='docked' ? 'Ancorada' : 'Em órbita') : `${E.travelCost(state,p.id)} combustível`} ${p.scanned ? '· ✓' : ''}</small></button>`).join('')}</div>`;
    }
  }
  function render() {
    if(!state.galaxy.planets.some(p=>p.id===selected)) selected=state.location.planetId;
    root.querySelectorAll('.og-tabs button').forEach(b=>{ const active=b.dataset.tab===tab;b.classList.toggle('is-active',active);b.setAttribute('aria-pressed',String(active)); });
    root.dataset.view=tab;
    renderResources();renderScene();
    $('og-sidebar').innerHTML=tab==='ship' ? shipPanel() : tab==='galaxy' ? galaxyPanel() : tab==='log' ? logPanel() : planetPanel();
    renderLower();
  }
  function message(text,ok) { $('og-message').textContent=text;$('og-message').parentElement.classList.toggle('is-error',ok===false); }
  function playSound(kind) {
    if(!soundEnabled) return;
    try {
      audioContext=audioContext || new (window.AudioContext||window.webkitAudioContext)();
      audioContext.resume();
      const osc=audioContext.createOscillator(),gain=audioContext.createGain(),time=audioContext.currentTime;
      osc.type='sine';osc.frequency.setValueAtTime(kind==='warp' ? 90 : kind==='error' ? 160 : 500,time);osc.frequency.exponentialRampToValueAtTime(kind==='warp' ? 700 : kind==='error' ? 85 : 900,time+.3);
      gain.gain.setValueAtTime(0.0001,time);gain.gain.exponentialRampToValueAtTime(.055,time+.03);gain.gain.exponentialRampToValueAtTime(.0001,time+.35);osc.connect(gain);gain.connect(audioContext.destination);osc.start(time);osc.stop(time+.36);
    } catch (_) {}
  }
  function act(action,payload) {
    const oldInventory=new Set(state.inventory.map(m=>m.id));
    let result;
    try { result=E.dispatch(state,action,payload||{}); } catch(err) { message('Não foi possível concluir a ação. A expedição continua disponível.',false); console.error(err);return {ok:false,message:String(err)}; }
    message(result.message,result.ok);
    if(!result.ok) {playSound('error');return result;}
    if(['travel','warp','rescue'].includes(action)) {selected=state.location.planetId;tab='explore';lastFound=null;}
    if(action==='explore') lastFound=state.inventory.find(m=>!oldInventory.has(m.id)) || lastFound;
    if(['travel','warp','scan','dock','explore'].includes(action)) {
      scene.effect(action);root.dataset.effect=action;
      $('og-event-label').textContent=({travel:'Traçando nova rota',warp:'Dobra espacial',scan:'Analisando assinaturas',dock:'Ancoragem estabelecida',explore:'Expedição de superfície'})[action];
      clearTimeout(effectTimer);effectTimer=setTimeout(()=>{delete root.dataset.effect;},1100);
    }
    playSound(action);persist();render();
    return result;
  }
  function closeDialog() {
    $('og-dialog').hidden=true;$('og-dialog').innerHTML='';
    Array.from(root.children).forEach(el=>{el.inert=false;});
    if(focusBeforeDialog && focusBeforeDialog.isConnected) focusBeforeDialog.focus();
  }
  function dialog(title,body) {
    focusBeforeDialog=document.activeElement;
    const el=$('og-dialog');el.hidden=false;
    el.innerHTML=`<section class="og-dialog" role="dialog" aria-modal="true" aria-labelledby="og-dialog-title"><div class="og-dialog-head"><h2 id="og-dialog-title">${esc(title)}</h2><button data-action="close-dialog" aria-label="Fechar">×</button></div>${body}</section>`;
    Array.from(root.children).forEach(child=>{if(child!==el)child.inert=true;});
    el.querySelector('button').focus();
  }
  function help() {
    dialog('Seu primeiro salto começa aqui.',`<p>Você comanda uma exploradora modular. As decisões são por turno: nada consome recursos enquanto você pensa.</p><ol><li><b>Analise o planeta</b> para descobrir atmosfera, radiação e anomalias.</li><li><b>Ancore e explore</b> os três pontos de interesse. Cada expedição consome oxigênio; ambientes hostis também danificam o casco.</li><li><b>Equipe suas descobertas</b> em Minha nave. A peça anterior volta ao armazém, e a potência muda as capacidades reais da nave.</li><li><b>Abasteça na oficina.</b> Minério serve para combustível e reparos; cristais viram células de dobra. Oxigênio é gratuito quando ancorado em um planeta respirável; fora dele, custa créditos ou minério.</li><li><b>Viaje mais longe.</b> Saia do planeta para viajar. Na aba Galáxia, use células de dobra para gerar uma nova região.</li></ol><div class="og-rarity-legend">${Object.values(E.rarities).map(r=>`<span style="color:${r.color}">● ${esc(r.name)}</span>`).join('')}</div><p>Arraste para girar a nave; use a roda do mouse para aproximar. O progresso é salvo automaticamente quando o navegador permite. Se faltar recurso, a oficina oferece resgate.</p><button class="og-button primary" data-action="close-dialog">Vamos explorar</button><button class="og-button secondary small" data-action="reset-dialog">Começar uma nova expedição</button>`);
  }
  function onClick(event) {
    const button=event.target.closest('button,a');if(!button||!root.contains(button)||button.disabled)return;
    if(button.dataset.tab) {tab=button.dataset.tab;render();persist();return;}
    if(button.dataset.select) {selected=button.dataset.select;render();persist();return;}
    const action=button.dataset.action;if(!action)return;
    event.preventDefault();
    if(action==='home') {tab='explore';render();return;}
    if(action==='help') return help();
    if(action==='close-dialog') return closeDialog();
    if(action==='camera') {scene.resetCamera();return;}
    if(action==='sound') {soundEnabled=!soundEnabled;button.textContent=soundEnabled?'Som: on':'Som: off';button.setAttribute('aria-pressed',String(soundEnabled));button.setAttribute('aria-label',soundEnabled?'Desativar sons':'Ativar sons');playSound('toggle');return;}
    if(action==='rescue-dialog') {dialog('Voltar em segurança',`<p>O resgate restaura os recursos essenciais e devolve a nave à órbita. Parte do minério, dos cristais e dos créditos paga o serviço. Seus módulos são preservados.</p><button class="og-button primary" data-action="confirm-rescue">Confirmar resgate</button><button class="og-button secondary" data-action="close-dialog">Continuar por conta própria</button>`);return;}
    if(action==='confirm-rescue') {closeDialog();act('rescue');return;}
    if(action==='reset-dialog') {dialog('Uma nova fronteira',`<p>Isso substitui sua expedição salva por uma nova nave e novos mundos.</p><button class="og-button primary" data-action="confirm-reset">Confirmar nova expedição</button><button class="og-button secondary" data-action="close-dialog">Manter minha expedição</button>`);return;}
    if(action==='confirm-reset') {closeDialog();state=E.create();tab='explore';selected=state.location.planetId;lastFound=null;persist();render();message('Nova expedição iniciada. Seu primeiro planeta espera pela análise.');return;}
    const payload={};if(button.dataset.planet)payload.planetId=button.dataset.planet;if(button.dataset.site)payload.siteId=button.dataset.site;if(button.dataset.module)payload.moduleId=button.dataset.module;if(button.dataset.color)payload.color=button.dataset.color;
    act(action,payload);
  }
  function onSubmit(event) {if(event.target.id==='og-name-form'){event.preventDefault();act('rename',{name:$('og-name').value.trim()});}}
  function onKey(event) {
    if(event.key==='Escape'&&!$('og-dialog').hidden){closeDialog();return;}
    if(!$('og-dialog').hidden && event.key==='Tab') {
      const controls=Array.from($('og-dialog').querySelectorAll('button,input,a')).filter(e=>!e.disabled);
      if(event.shiftKey&&document.activeElement===controls[0]){event.preventDefault();controls[controls.length-1].focus();}
      else if(!event.shiftKey&&document.activeElement===controls[controls.length-1]){event.preventDefault();controls[0].focus();}return;
    }
    if(/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||!$('og-dialog').hidden)return;
    if(['1','2','3','4'].includes(event.key)){tab=['explore','ship','galaxy','log'][Number(event.key)-1];render();persist();}
  }
  function onGlobals(event) {const snapshot=event.detail&&event.detail.globals&&event.detail.globals.widgetState;if(snapshot&&applySnapshot(snapshot)){lastFound=null;render();}}
  root.addEventListener('click',onClick);root.addEventListener('submit',onSubmit);root.addEventListener('keydown',onKey);window.addEventListener('openai:set_globals',onGlobals);
  window.orbitApp={getState:()=>state,act,getView:()=>({tab,selected}),destroy(){scene.destroy();clearTimeout(effectTimer);root.removeEventListener('click',onClick);root.removeEventListener('submit',onSubmit);root.removeEventListener('keydown',onKey);window.removeEventListener('openai:set_globals',onGlobals);if(audioContext)audioContext.close();}};
  render();
  if(loaded)message('Bem-vindo de volta, comandante. Sua expedição está pronta para continuar.');
})();

</script>
