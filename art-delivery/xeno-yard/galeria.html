</style><main><header><small>ÓRBITA　/　CADERNO DE CAMPO</small><h1>Coleção de bordo</h1><p>Examine as pinturas. Use a escala de celular e compare os exemplares pela silhueta.</p></header><nav id="tabs" aria-label="Coleção"></nav><nav aria-label="Exibição"><label>Escala <select id="size"><option>30</option><option>48</option><option selected>120</option></select> px</label><button id="mode" aria-pressed="false">Silhuetas do catálogo</button></nav><section id="grid"></section><footer>34 ilustrações originais　·　Xenobiologia e Estaleiro estelar</footer></main><dialog><button id="close">Fechar</button><img id="hero" alt=""><small id="kicker"></small><h2 id="title"></h2><p id="desc"></p></dialog><script>
const items= [{"g": "xeno-tools", "id": "garra", "n": "Garra de contenção", "s": "alcança criaturas que fogem (Raposa-aurora, Salamandra de brasa, Urso-geada). Custa 160 Lumes."}, {"g": "xeno-tools", "id": "rede", "n": "Rede de plasma", "s": "revela e envolve organismos camuflados (Mariposa de cristal, Escaravelho-ferro, Coral cantor). Só aparecem depois de um escaneamento. Custa 140 Lumes."}, {"g": "xeno-tools", "id": "casulo", "n": "Casulo selado", "s": "guarda organismos que liberam toxina (Leviatã de vidro, Lesma ácida, Samambaia-mãe, Trepadeira prisma). Na expedição, a toxina custa integridade do traje. Custa 180 Lumes."}, {"g": "xeno-tools", "id": "laco", "n": "Laço gravitacional", "s": "ancora criaturas que flutuam nas correntes (Arraia-tempestade, Alga nebular). Custa 220 Lumes."}, {"g": "xeno-tools", "id": "crio", "n": "Cápsula criogênica", "s": "carrega flora que congela ao toque e só vive no gelo (Orquídea eterna, Flor do vazio). Custa 200 Lumes."}, {"g": "xeno-tools", "id": "termico", "n": "Coletor térmico", "s": "isola plantas que irradiam calor ao serem tocadas (Lírio solar, Cacto de magma). O calor custa integridade do traje. Custa 200 Lumes."}, {"g": "xeno-specimens", "id": "raposa-aurora", "n": "Raposa-aurora", "s": "saudade, elegância, velocidade. A última da espécie."}, {"g": "xeno-specimens", "id": "salamandra-brasa", "n": "Salamandra de brasa", "s": "perigo calmo, brasa viva."}, {"g": "xeno-specimens", "id": "urso-geada", "n": "Urso-geada", "s": "gigante sereno, solidão gelada, respeito."}, {"g": "xeno-specimens", "id": "mariposa-cristal", "n": "Mariposa de cristal", "s": "delicado, mágico, quase invisível."}, {"g": "xeno-specimens", "id": "escaravelho-ferro", "n": "Escaravelho-ferro", "s": "robusto, teimoso, blindado."}, {"g": "xeno-specimens", "id": "leviata-vidro", "n": "Leviatã de vidro", "s": "colossal, sagrado, belo e perigoso."}, {"g": "xeno-specimens", "id": "lesma-acida", "n": "Lesma ácida", "s": "curiosa, humilde e útil. Ácida, mas purificadora."}, {"g": "xeno-specimens", "id": "arraia-tempestade", "n": "Arraia-tempestade", "s": "poder tranquilo, dona da tempestade."}, {"g": "xeno-specimens", "id": "samambaia-mae", "n": "Samambaia-mãe", "s": "ancestral, matriarcal, sagrada."}, {"g": "xeno-specimens", "id": "orquidea-eterna", "n": "Orquídea eterna", "s": "eterno, frágil, solene."}, {"g": "xeno-specimens", "id": "flor-vazio", "n": "Flor do vazio", "s": "mistério cósmico, silêncio do espaço profundo."}, {"g": "xeno-specimens", "id": "lirio-solar", "n": "Lírio solar", "s": "caloroso, generoso, esperança."}, {"g": "xeno-specimens", "id": "cacto-magma", "n": "Cacto de magma", "s": "força geológica, batimento."}, {"g": "xeno-specimens", "id": "alga-nebular", "n": "Alga nebular", "s": "leveza, sonho, liberdade."}, {"g": "xeno-specimens", "id": "coral-cantor", "n": "Coral cantor", "s": "musical, comunitário, escondido."}, {"g": "xeno-specimens", "id": "trepadeira-prisma", "n": "Trepadeira prisma", "s": "beleza perigosa, paciente."}, {"g": "yard-parts", "id": "tanque-externo", "n": "Tanque externo", "s": "+20 de tanque de combustível. Massa 4, sem consumo de energia. 140 Lumes."}, {"g": "yard-parts", "id": "reservatorio-o2", "n": "Reservatório de O₂", "s": "+15 de reserva de oxigênio. Massa 2. 120 Lumes."}, {"g": "yard-parts", "id": "placas-casco", "n": "Placas de casco", "s": "+10 de resistência do casco. Massa 3. 110 Lumes. Pode-se montar várias."}, {"g": "yard-parts", "id": "vela-solar", "n": "Vela solar", "s": "+5% de eficiência do ar e gera 2 de energia para outras peças. Massa 1. 260 Lumes."}, {"g": "yard-parts", "id": "quilha", "n": "Quilha estabilizadora", "s": "+6% de eficiência de voo. Massa 3, consome 1 de energia. 180 Lumes."}, {"g": "yard-parts", "id": "nacela", "n": "Nacela auxiliar", "s": "+10% de voo e +5% de dobra. Massa 4, consome 2 de energia. 300 Lumes."}, {"g": "yard-parts", "id": "baia-drones", "n": "Baia de drones", "s": "+10% de coleta e +1 de carga na expedição. Massa 5, consome 3
